name: Keep Backend Awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check backend health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          : "${BACKEND_URL:?Set the BACKEND_URL repository variable}"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 150 \
            "${BACKEND_URL%/}/health" | jq -e '.status == "ok"'
